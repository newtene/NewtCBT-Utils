<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NewtCBT Companion</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d12;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }
    #topbar {
      height: 42px;
      min-height: 42px;
      flex-shrink: 0;
      width: 100%;
      background: #09090b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      gap: 8px;
      user-select: none;
      z-index: 20;
    }
    #topbar.hidden {
      display: none !important;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fafafa;
      white-space: nowrap;
      min-width: 0;
    }
    .brand-logo {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 9px;
      height: 28px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #18181b;
      color: #e4e4e7;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: #27272a;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary {
      background: #ffffff;
      color: #09090b;
      border-color: rgba(255, 255, 255, 0.25);
      font-weight: 700;
    }
    .btn-primary:hover {
      background: #f4f4f5;
      color: #000000;
    }
    .btn-icon {
      width: 28px;
      padding: 0;
    }
    #btn-close:hover {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-success {
      background: rgba(16, 185, 129, 0.15) !important;
      color: #34d399 !important;
      border-color: rgba(16, 185, 129, 0.4) !important;
    }
    #frame-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: #0d0d12;
    }
    #companion-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d0d12;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d12;
      color: #a1a1aa;
      font-size: 13px;
      gap: 12px;
      transition: opacity 0.2s ease;
      pointer-events: none;
      z-index: 30;
    }
    #loading-overlay.hidden {
      display: none;
      opacity: 0;
    }
    .idle-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d12;
      padding: 24px;
      z-index: 10;
    }
    .idle-container.hidden {
      display: none;
    }
    .idle-card {
      max-width: 290px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .idle-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
    }
    .idle-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }
    .idle-title {
      font-size: 14px;
      font-weight: 700;
      color: #fafafa;
      letter-spacing: -0.01em;
    }
    .idle-desc {
      font-size: 12px;
      line-height: 1.5;
      color: #a1a1aa;
    }
    .idle-actions {
      margin-top: 6px;
    }
    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    .spinner-lg {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="topbar" class="hidden">
    <div class="brand">
      <img src="logo-32.png" class="brand-logo" alt="" onerror="this.style.display='none'" />
      <span>NewtCBT</span>
    </div>
    <div class="actions">
      <button class="btn" id="btn-retry" title="Retry step or re-generate this solution">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>Retry step</span>
      </button>
      <button class="btn btn-primary" id="btn-add-solution" title="Extract solution and add/replace in NewtCBT">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span id="txt-add-soln">Add solution to NewtCBT</span>
      </button>
      <button class="btn btn-icon" id="btn-close" title="Close sidebar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
  <div id="frame-container">
    <div id="idle-state" class="idle-container">
      <div class="idle-card">
        <div class="idle-icon-wrap">
          <img src="logo-48.png" alt="" class="idle-logo" onerror="this.style.display='none'" />
        </div>
        <div class="idle-title">NewtCBT Companion</div>
        <div class="idle-desc">Sidebar is ready. Start a generation on NewtCBT or open Google AI Studio directly.</div>
        <div class="idle-actions">
          <button id="btn-launch-aistudio" class="btn btn-primary">Open Google AI Studio</button>
        </div>
      </div>
    </div>
    <div id="loading-overlay" class="hidden">
      <div class="spinner spinner-lg"></div>
      <span id="loading-text">Connecting to Assistant...</span>
    </div>
    <iframe id="companion-frame" src="about:blank" allow="clipboard-read; clipboard-write; microphone"></iframe>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
