<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NewtCBT AI Studio Companion</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d12;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #companion-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #0d0d12;
    }
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d12;
      color: #a1a1aa;
      font-size: 13px;
      gap: 12px;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    #loading-overlay.hidden {
      opacity: 0;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <span>Connecting to Google AI Studio...</span>
  </div>
  <iframe id="companion-frame" src="about:blank" allow="clipboard-read; clipboard-write; microphone"></iframe>
  <script src="sidepanel.js"></script>
</body>
</html>
